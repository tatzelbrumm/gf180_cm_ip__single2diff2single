short-description: Single-ended-to-differential-to-single-ended analog pad buffer pair for GF180MCU (gf180mcuD), ported from the IHP sg13cmos5l design.

# Please add the documentation about your project here.
# Why did you choose to create it? How does it work? How can it be tested, etc.?
# If your project requires additional external hardware, e.g. a USB port,
# please mention this so it can be considered when designing the PCB.
long-description: |
  Single-ended <-> differential analog pad buffers for I/O-limited shared-die
  platforms (Chipalooza, TinyTapeout, HeiChips).

  On-chip analog building blocks should be fully differential for signal range
  and supply rejection, but multi-user platforms hand each participant only a
  few single-ended pads. This macro bridges that gap: a single-ended input pad
  is buffered into a fully differential on-chip signal, and a differential-in
  driver buffers it back out to a single-ended output pad.

  This is the GlobalFoundries GF180MCU (gf180mcuD) port of the IHP sg13cmos5l
  design. The macros are `gf180mcu_IOPadSingle2Diff` and
  `gf180mcu_IOPadDiff2Single` in macros/. The pads come from
  `gf180mcu_ocd_io__asig_5p0`, which carries HBM diodes only; the CDM
  protection next to the gates is part of this design.

  NOTE: this repository is a skeleton. The layout, schematics and netlists are
  not yet drawn for GF180, and the operating limits (docs/OPERATING_LIMITS.md)
  are not yet decided. Rewrite this section to describe the as-built circuit,
  how it is tested and what external hardware it needs, once the design exists.

