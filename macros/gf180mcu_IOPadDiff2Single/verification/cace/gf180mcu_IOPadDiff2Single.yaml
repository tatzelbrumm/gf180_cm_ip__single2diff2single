#--------------------------------------------------------------

name:           gf180mcu_IOPadDiff2Single
description:    "Class-AB differential to single-ended pad driver with bias tree and enable, GF180MCU 03v3"
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 8, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Analog supply (front end, bias, enables)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Ground
    type: ground
    direction: inout
  vddo:
    description: Output-stage supply (OP, RP1, SA)
    type: power
    direction: inout
  vsso:
    description: Output-stage ground (ON, RN1, SB)
    type: ground
    direction: inout
  inp:
    description: Positive input
    type: signal
    direction: inout
  inn:
    description: Negative input
    type: signal
    direction: inout
  vref:
    description: Output reference
    type: signal
    direction: inout
  out:
    description: Pad output, out - vref = (inp - inn)/2
    type: signal
    direction: inout
  iref:
    description: Reference current input, 5 uA into the pin
    type: signal
    direction: inout
  en:
    description: Enable, active high, 0 / vdd
    type: digital
    direction: inout

default_conditions:
  vdd:
    description: Supply voltage (vdd = vddo)
    display: VDD
    unit: V
    typical: 3.3
  en_v:
    description: Enable level
    display: en
    unit: V
    typical: 3.3
  i_ref:
    description: Reference current into iref
    display: Iref
    unit: A
    typical: 5e-6
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  corner_res:
    description: Process corner resistors
    display: Corner resistor
    typical: res_typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  rload:
    description: Load resistor to vref
    display: R load
    unit: Ohm
    typical: 1000
  cload:
    description: Load capacitor to vss
    display: C load
    unit: F
    typical: 100e-12

parameters:
  on_params:
    spec:
      gain:
        display: Gain - enabled
        description: '(vo(+0.2 V) - vo(-0.2 V)) / 0.4 V, vo = out - vref'
        unit: ''
        minimum: {value: 0.495}
        typical: {value: 0.5}
        maximum: {value: 0.505}
      vos:
        display: Output offset - enabled
        description: 'out - vref at vd = 0'
        unit: 'mV'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      iq_p:
        display: OP quiescent current - enabled
        description: 'drain current of OP, real bias tree (target 212 uA)'
        unit: 'uA'
        minimum: {value: 100}
        typical: {value: 212}
        maximum: {value: 500}
      i_dd:
        display: Supply current - enabled
        description: 'vdd + vddo; the 5 uA reference comes from its own supply'
        unit: 'uA'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 600}
    tool:
      ngspice:
        template: gf180mcu_IOPadDiff2Single_tb_on.sch
        format: ascii
        suffix: .data
        variables: [gain, vos, iq_p, i_dd]
    plot:
      iq_p_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: iq_p
        limits: auto
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12
      i_ref:
        typical: 5e-6
      en_v:
        typical: 3.3

  off_params:
    spec:
      idd_off:
        display: Supply current - disabled
        description: 'vdd + vddo with en = 0, reference source excluded'
        unit: 'nA'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 100}
      va_off:
        display: OP gate below vddo - disabled
        description: 'vddo - v(a)'
        unit: 'mV'
        minimum: {value: -1}
        typical: {value: 0}
        maximum: {value: 1}
      vb_off:
        display: ON gate above vsso - disabled
        description: 'v(b)'
        unit: 'mV'
        minimum: {value: -1}
        typical: {value: 0}
        maximum: {value: 1}
      vout_off:
        display: Output - disabled
        description: 'out - vref (load to vref)'
        unit: 'mV'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      iref_n:
        display: NI gate line - disabled
        description: 'v(iref_en), pulled to vss'
        unit: 'mV'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 10}
      iref_off:
        display: Reference current - disabled
        description: 'what the external source still delivers into iref'
        unit: 'nA'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: gf180mcu_IOPadDiff2Single_tb_off.sch
        format: ascii
        suffix: .data
        variables: [idd_off, va_off, vb_off, vout_off, iref_n, iref_off]
    plot:
      idd_off_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: idd_off
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12
      i_ref:
        typical: 5e-6
      en_v:
        typical: 0

  enable_params:
    spec:
      glitch:
        display: Output glitch at enable
        description: 'max |out - vref| after en rises, vd = 0'
        unit: 'mV'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      t_on:
        display: Enable time
        description: 'en edge until out stays within 1 mV of vref'
        unit: 'us'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 20}
      iqp:
        display: OP current after enable
        description: 'at 30 us'
        unit: 'uA'
        minimum: {value: 100}
        typical: {value: 212}
        maximum: {value: 500}
    tool:
      ngspice:
        template: gf180mcu_IOPadDiff2Single_tb_enable.sch
        format: ascii
        suffix: .data
        variables: [glitch, t_on, iqp]
    plot:
      t_on_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: t_on
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12
      i_ref:
        typical: 5e-6

