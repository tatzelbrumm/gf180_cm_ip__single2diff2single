name:           OgueyAebischerRef_06v0
description:    Oguey-Aebischer resistor-free current reference + start-up kick, GF180MCU, 6 V nfet_06v0/pfet_06v0 devices, 3.3 V and 5 V supply
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 6, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 5.5
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vbp:
    description: PMOS current-mirror bias voltage (to downstream PMOS legs)
    type: signal
    direction: output
  vbn:
    description: NMOS current-mirror bias voltage (to downstream NMOS legs)
    type: signal
    direction: output
  vbr:
    description: Resistor-free reference node (gates of the MOS triode stack)
    type: signal
    direction: output
  disable:
    description: Active-high shutdown of the core and the start-up kick
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 3.3
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  dc_params:
    spec:
      Vbp_val:
        display: PMOS mirror bias voltage
        description: Operating point of vbp
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Vbn_val:
        display: NMOS mirror bias voltage
        description: Operating point of vbn
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Vbr_val:
        display: Resistor-free reference voltage
        description: Operating point of vbr
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Ibias_val:
        display: Core reference current
        description: Current in the M12/M10 branch (ammeter Vi1). Limits are placeholders around the 100 nA target.
        unit: nA
        minimum: {value: 70}
        typical: {value: 100}
        maximum: {value: 130}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [Vbp_val, Vbn_val, Vbr_val, Ibias_val]
    plot:
      Ibias_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Ibias_val
        limits: auto
      Ibias_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Ibias_val
        limits: auto
      Ibias_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Ibias_val
        limits: auto
      Vbr_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Vbr_val
        limits: auto
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6, 5.0, 5.5]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 85]

  tran_startup_params:
    spec:
      t_startup:
        display: Start-up time
        description: End of the supply ramp until I1 stays within 10 % of its final value (negative = settled during the ramp). Limits are the IHP deck's.
        unit: us
        minimum: {value: any}
        typical: {value: 20}
        maximum: {value: 40}
      Vbp_final:
        display: Settled vbp
        description: vbp at the end of the transient
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Vbn_final:
        display: Settled vbn
        description: vbn at the end of the transient
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Vbr_final:
        display: Settled vbr
        description: vbr at the end of the transient
        unit: V
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [t_startup, Vbp_final, Vbn_final, Vbr_final]
    plot:
      t_startup_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: t_startup
        limits: auto
      t_startup_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: t_startup
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      tramp:
        description: Supply ramp time 0 -> vdd
        display: Ramp
        unit: s
        enumerate: [1e-6, 1e-3]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 85]

  ac_psrr_params:
    spec:
      PSRR_vbr:
        display: PSRR of vbr at 1 kHz
        description: -20 log10 |v(vbr)/v(vdd)| at f_psrr. Limits kept from the IHP deck.
        unit: dB
        minimum: {value: 50}
        typical: {value: 60}
        maximum: {value: any}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_ac_psrr.sch
        format: ascii
        suffix: .data
        variables: [PSRR_vbr]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      temp:
        typical: 27

  noise_params:
    spec:
      Ibias_noise:
        display: Output current noise density
        description: Spot noise of the mirrored current (replica of M11) at f_spot. Limits kept from the IHP deck (inherited from sky130).
        unit: nA/rtHz
        minimum: {value: any}
        typical: {value: 0.5}
        maximum: {value: 1}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_noise.sch
        format: ascii
        suffix: .data
        variables: [Ibias_noise]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      temp:
        typical: 27

  disable_params:
    spec:
      t_disable:
        display: Turn-off time
        description: disable edge until vbr falls through 100 mV
        unit: ns
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      Iq_enabled:
        display: Quiescent supply current, enabled
        description: Average supply current, enabled. Limit is a placeholder (about 8 x I1 by construction).
        unit: uA
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 2}
      Iq_disabled:
        display: Quiescent supply current, disabled
        description: Average supply current, disabled
        unit: nA
        minimum: {value: any}
        typical: {value: 10}
        maximum: {value: 20}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_tran_disable.sch
        format: ascii
        suffix: .data
        variables: [t_disable, Iq_enabled, Iq_disabled]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      temp:
        typical: 27

  mm_params:
    spec:
      Ibias_accuracy:
        display: Core current accuracy - Mismatch
        description: (I1 - 100 nA) / 100 nA under local mismatch. Limits are placeholders (3 sigma of a 5 % design goal).
        unit: '%'
        minimum: {value: -15}
        typical: {value: 0}
        maximum: {value: 15}
      Leg_matching:
        display: Leg-to-leg current matching - Mismatch
        description: I2 / (4 I1) - 1, the 1:4 PMOS mirror M12:M13. Limits are placeholders.
        unit: '%'
        minimum: {value: -6}
        typical: {value: 0}
        maximum: {value: 6}
    tool:
      ngspice:
        template: OgueyAebischerRef_06v0_tb_dc_mm.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Ibias_accuracy, Leg_matching]
    conditions:
      vdd:
        typical: 3.3
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: typical
      mm:
        typical: 1
      temp:
        typical: 27
