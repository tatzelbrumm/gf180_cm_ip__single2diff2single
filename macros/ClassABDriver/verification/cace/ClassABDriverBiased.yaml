#--------------------------------------------------------------
# CACE circuit characterization file, proof of concept (2026-10-08)
# ClassABDriver on the ideal bias fixture. Port of the IHP decks tb_mpdda_{dc,loop,step,noise} to gf180mcuD.
# Generated by ../../scripts/gen_cace.py; edit this file from now on. Limits: IHP d2s_miller_biased draft
# where it had one, otherwise placeholders.
#--------------------------------------------------------------

name:           ClassABDriverBiased
description:    "ClassABDriver (matched-pair DDA, folded cascode, class-AB output, Miller compensation) on the ideal bias fixture, GF180MCU 03v3"
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 8, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Front-end and bias supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Ground
    type: ground
    direction: inout
  vddo:
    description: Output-stage supply (OP, RP1)
    type: power
    direction: inout
  vsso:
    description: Output-stage ground (ON, RN1)
    type: ground
    direction: inout
  vinp:
    description: Positive input
    type: signal
    direction: inout
  vinn:
    description: Negative input
    type: signal
    direction: inout
  vref:
    description: Output reference (vout - vref = (vinp - vinn)/2)
    type: signal
    direction: inout
  vout:
    description: Output
    type: signal
    direction: inout
  vfb:
    description: Feedback input (tied to vout in normal use)
    type: signal
    direction: inout
  vbp:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout
  vbn:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout
  vbpc:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout
  vbnc:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout
  vabp:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout
  vabn:
    description: Bias line of the ideal fixture, exposed for perturbation
    type: signal
    direction: inout

default_conditions:
  vdd:
    description: Supply voltage (vdd = vddo)
    display: VDD
    unit: V
    typical: 3.3
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  corner_res:
    description: Process corner resistors
    display: Corner resistor
    typical: res_typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  rload:
    description: Load resistor to vref
    display: R load
    unit: Ohm
    typical: 1000
  cload:
    description: Load capacitor to vss
    display: C load
    unit: F
    typical: 100e-12

parameters:
  dc_params:
    spec:
      gain:
        display: Gain
        description: '(vo(+0.2 V) - vo(-0.2 V)) / 0.4 V, vo = vout - vref; nominal 0.5'
        unit: ''
        minimum: {value: 0.495}
        typical: {value: 0.5}
        maximum: {value: 0.505}
      vos:
        display: Output offset
        description: 'vout - vref at vd = 0'
        unit: 'mV'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      inl:
        display: Integral nonlinearity
        description: 'max deviation from the gain line, vo within +-0.2 V'
        unit: 'mV'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 2}
      iqp:
        display: OP quiescent current
        description: 'drain current of OP at vd = 0 (target 212 uA)'
        unit: 'uA'
        minimum: {value: 100}
        typical: {value: 212}
        maximum: {value: 500}
      iqn:
        display: ON quiescent current
        description: 'drain current of ON at vd = 0'
        unit: 'uA'
        minimum: {value: 100}
        typical: {value: 212}
        maximum: {value: 500}
      idd:
        display: Supply current
        description: 'vdd + vddo at vd = 0'
        unit: 'uA'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 600}
    tool:
      ngspice:
        template: ClassABDriverBiased_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [gain, vos, inl, iqp, iqn, idd]
    plot:
      iqp_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: iqp
        limits: auto
      vos_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: vos
        limits: auto
      inl_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: inl
        limits: auto
    conditions:
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12

  loop_params:
    spec:
      T0:
        display: DC loop gain
        description: 'loop gain at 10 Hz'
        unit: 'dB'
        minimum: {value: 40}
        typical: {value: any}
        maximum: {value: any}
      fc:
        display: Loop crossover frequency
        description: 'unity loop gain'
        unit: 'MHz'
        minimum: {value: 1}
        typical: {value: any}
        maximum: {value: any}
      pm:
        display: Phase margin
        description: '180 deg + phase of T at fc'
        unit: '°'
        minimum: {value: 45}
        typical: {value: 60}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABDriverBiased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0, fc, pm]
    plot:
      pm_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: pm
        limits: auto
      T0_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: T0
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12

  loop_load_params:
    spec:
      T0:
        display: DC loop gain vs load
        description: 'loop gain at 10 Hz'
        unit: 'dB'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      fc:
        display: Crossover vs load
        description: 'unity loop gain'
        unit: 'MHz'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      pm:
        display: Phase margin vs load
        description: '180 deg + phase of T at fc'
        unit: '°'
        minimum: {value: 45}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABDriverBiased_tb_loop.sch
        format: ascii
        suffix: .data
        variables: [T0, fc, pm]
    plot:
      pm_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: pm
        limits: auto
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      temp:
        typical: 27
      rload:
        enumerate: [50, 1000, 1000000000.0]
      cload:
        enumerate: [10e-12, 100e-12, 1e-9]

  step_params:
    spec:
      overshoot:
        display: Overshoot
        description: 'step -0.25 -> +0.25 V at the output'
        unit: '%'
        minimum: {value: any}
        typical: {value: 0}
        maximum: {value: 10}
      slew:
        display: Rise rate
        description: '10 - 90 % of the step over its time'
        unit: 'V/us'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
      t_settle:
        display: 1 % settling time
        description: 'after the input step'
        unit: 'ns'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: 1000}
    tool:
      ngspice:
        template: ClassABDriverBiased_tb_step.sch
        format: ascii
        suffix: .data
        variables: [overshoot, slew, t_settle]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      temp:
        enumerate: [-40, 27, 125]
      rload:
        typical: 1000
      cload:
        typical: 100e-12

  noise_params:
    spec:
      vn_total:
        display: Output noise
        description: 'integrated 10 Hz ... 10 MHz'
        unit: 'uV'
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABDriverBiased_tb_noise.sch
        format: ascii
        suffix: .data
        variables: [vn_total]
    conditions:
      vdd:
        typical: 3.3
      corner_mos:
        enumerate: [typical, ss, ff]
      temp:
        typical: 27
      rload:
        typical: 1000
      cload:
        typical: 100e-12

