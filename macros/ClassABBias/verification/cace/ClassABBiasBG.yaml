#--------------------------------------------------------------
# CACE circuit characterization file (2026-10-09): GF180 bandgap reference ClassABBiasBG.
# Limits are the targets agreed on 2026-10-08 (kickoff_reference_redesign.md section 3): drift +-3 % over
# -40...125 C, line sensitivity <= 1 %/V, start-up from 0 V with 1 us and 1 ms ramps, mismatch sigma <= 2 %
# (checked as +-6 % on the extremes of 100 runs; sigma from the csv). Process spread and leakage: report only.
# Generated by ../../scripts/gen_cace_bg.py; edit this file from now on.
#--------------------------------------------------------------

name:           ClassABBiasBG
description:    "Self-contained current-mode bandgap reference of the class-AB driver, 5 uA out of iout, GF180MCU 03v3"
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 9, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Analog supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  iout:
    description: Reference current output, 5 uA flowing OUT of the pin (into the ClassABBiasIn tree's iref)
    type: signal
    direction: output
  en:
    description: Enable, active high (0 / vdd)
    type: digital
    direction: input
  en_b:
    description: Complement of en (from PadEnable/EnableInv)
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Analog supply voltage
    display: VDD
    unit: V
    typical: 3.3
  en:
    description: Enable (1 = enabled, 0 = disabled), as a fraction of vdd
    display: en
    typical: 1
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  corner_res:
    description: Process corner resistors (sm141064.ngspice section)
    display: Corner resistor
    typical: res_typical
  corner_bjt:
    description: Process corner vertical PNPs (sm141064.ngspice section)
    display: Corner PNP
    typical: bjt_typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch; MOS and PNP, the PDK has no resistor mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  t_ramp:
    description: Supply ramp time
    display: Ramp
    unit: s
    typical: 1e-6

parameters:
  dc_params:
    spec:
      e_iout:
        display: Error of iout
        description: 'Deviation of iout from 5 uA over MOS corners, supply and temperature (resistors and PNPs typical).'
        unit: '%'
        minimum: {value: -3}
        typical: {value: 0}
        maximum: {value: 3}
      Idd:
        display: Supply current
        description: Current from vdd (enabled)
        unit: uA
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [e_iout, Idd]
    plot:
      e_iout_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: e_iout
        limits: auto
      e_iout_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: e_iout
        limits: auto
    conditions:
      en:
        typical: 1
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      corner_res:
        typical: res_typical
      corner_bjt:
        typical: bjt_typical
      temp:
        enumerate: [-40, 27, 125]

  spread_params:
    spec:
      e_iout:
        display: Error of iout - process spread
        description: 'Deviation of iout from 5 uA over resistor and PNP corners (R_sh +-25 % goes straight into the current; no trim). Report only.'
        unit: '%'
        minimum: {value: any}
        typical: {value: 0}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [e_iout, null]
    plot:
      e_iout_vs_corner_res:
        type: xyplot
        xaxis: corner_res
        yaxis: e_iout
        limits: auto
    conditions:
      en:
        typical: 1
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      corner_res:
        enumerate: [res_typical, res_ss, res_ff]
      corner_bjt:
        enumerate: [bjt_typical, bjt_ss, bjt_ff]
      temp:
        enumerate: [-40, 27, 125]

  line_params:
    spec:
      s_iout:
        display: Line sensitivity of iout
        description: 'DC change of iout per volt of vdd, 3.0 ... 3.6 V.'
        unit: '%/V'
        minimum: {value: -1}
        typical: {value: 0}
        maximum: {value: 1}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_line.sch
        format: ascii
        suffix: .data
        variables: [s_iout]
    conditions:
      en:
        typical: 1
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      corner_res:
        enumerate: [res_typical, res_ss, res_ff]
      corner_bjt:
        typical: bjt_typical
      temp:
        enumerate: [-40, 27, 125]

  tran_startup_params:
    spec:
      t_startup:
        display: Start-up time
        description: 'Time after the supply ramp until iout stays within +-10 % of its final value (negative: settled before the ramp ends). Limit: 20 us after a 1 us ramp (placeholder).'
        unit: 'us'
        minimum: {value: any}
        typical: {value: 1}
        maximum: {value: 20}
      e_end:
        display: Error of iout after start-up
        description: 'Deviation of iout from 5 uA 1 ms after the ramp: the core must reach its operating point, not a false one.'
        unit: '%'
        minimum: {value: -3}
        typical: {value: 0}
        maximum: {value: 3}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_startup.sch
        format: ascii
        suffix: .data
        variables: [t_startup, e_end]
    conditions:
      t_ramp:
        enumerate: [1e-6, 1e-3]
      vdd:
        enumerate: [3.0, 3.6]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      corner_res:
        typical: res_typical
      corner_bjt:
        typical: bjt_typical
      temp:
        enumerate: [-40, 27, 125]

  mm_params:
    spec:
      e_iout:
        display: Error of iout - Mismatch
        description: 'Deviation of iout from 5 uA under local mismatch (MOS, PNP), 100 runs; the limit is 3 sigma of the 2 % target.'
        unit: '%'
        minimum: {value: -6}
        typical: {value: 0}
        maximum: {value: 6}
      Idd:
        display: Supply current - Mismatch
        description: Current from vdd under local mismatch
        unit: uA
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_dc.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [e_iout, Idd]
    conditions:
      iterations:
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 100
        step: linear
        stepsize: 1
      mm:
        typical: 1
      en:
        typical: 1
      vdd:
        typical: 3.3
      corner_mos:
        typical: typical
      corner_res:
        typical: res_typical
      corner_bjt:
        typical: bjt_typical
      temp:
        typical: 27

  off_params:
    spec:
      Idd_off_end:
        display: Supply current disabled
        description: 'Current from vdd with en = 0, 200 us into a transient. Limit: placeholder.'
        unit: 'nA'
        minimum: {value: any}
        typical: {value: 1}
        maximum: {value: 50}
      iout_off:
        display: Output current disabled
        description: 'Current out of iout with en = 0 (into the NI-type diode). Limit: placeholder.'
        unit: 'nA'
        minimum: {value: any}
        typical: {value: 0.1}
        maximum: {value: 10}
    tool:
      ngspice:
        template: ClassABBiasBG_tb_off.sch
        format: ascii
        suffix: .data
        variables: [Idd_off_end, iout_off]
    conditions:
      en:
        typical: 0
      vdd:
        enumerate: [3.0, 3.6]
      corner_mos:
        enumerate: [typical, ss, ff]
      corner_res:
        typical: res_typical
      corner_bjt:
        typical: bjt_typical
      temp:
        enumerate: [-40, 27, 125]

