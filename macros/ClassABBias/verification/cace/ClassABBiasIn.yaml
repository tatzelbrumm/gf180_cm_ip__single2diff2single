name:           ClassABBiasIn
description:    "Bias of the class-AB driver, variant 1: reference current INTO iref (external PMOS source), GF180MCU 03v3"
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 8, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Analog supply (bias and front end)
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vddo:
    description: Output-stage supply (rail of OP and its replica RP1)
    type: power
    direction: inout
  vsso:
    description: Output-stage ground (rail of ON and its replica RN1)
    type: ground
    direction: inout
  iref:
    description: Reference current input, 5 uA flowing into the pin (NMOS input diode NI)
    type: signal
    direction: inout
  vbp:
    description: PMOS gate line, 5 uA diode BP (unit tails)
    type: signal
    direction: output
  vbn:
    description: NMOS gate line, 5 uA diode BN (fold sinks)
    type: signal
    direction: output
  vbpc:
    description: PMOS cascode gate line, 2 uA diode BPC
    type: signal
    direction: output
  vbnc:
    description: NMOS cascode gate line, 2 uA diode BNC
    type: signal
    direction: output
  vabp:
    description: class-AB P line, 5 uA into RP2 on RP1
    type: signal
    direction: output
  vabn:
    description: class-AB N line, 5 uA into RN2 on RN1
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog supply voltage (vddo = vdd)
    display: VDD
    unit: V
    typical: 3.3
  i_ref:
    description: Reference current
    display: Iref
    unit: A
    typical: 5e-6
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  corner_res:
    description: Process corner resistors (sm141064.ngspice section)
    display: Corner resistor
    typical: res_typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27

parameters:
  dc_params:
    spec:
      e_bp:
        display: Error of bp
        description: 'Deviation of the vbp diode current from 5 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bn:
        display: Error of bn
        description: 'Deviation of the vbn diode current from 5 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bpc:
        display: Error of bpc
        description: 'Deviation of the vbpc diode current from 2 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bnc:
        display: Error of bnc
        description: 'Deviation of the vbnc diode current from 2 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_abp:
        display: Error of abp
        description: 'Deviation of the vabp diode current from 5 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_abn:
        display: Error of abn
        description: 'Deviation of the vabn diode current from 5 uA. Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      Idd:
        display: Supply current
        description: Current from vdd (vddo tied to vdd), the reference current not included
        unit: uA
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABBiasIn_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [e_bp, e_bn, e_bpc, e_bnc, e_abp, e_abn, Idd]
    plot:
      e_bp_vs_temp:
        type: xyplot
