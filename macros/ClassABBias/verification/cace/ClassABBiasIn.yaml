        maximum: {value: 10}
      e_bpc:
        display: Error of bpc - Mismatch
        description: 'Deviation of the vbpc diode current under local mismatch. Limits are placeholders.'
        unit: '%'
        minimum: {value: -10}
        typical: {value: 0}
        maximum: {value: 10}
      e_bnc:
        display: Error of bnc - Mismatch
        description: 'Deviation of the vbnc diode current under local mismatch. Limits are placeholders.'
        unit: '%'
        minimum: {value: -10}
        typical: {value: 0}
        maximum: {value: 10}
      e_abp:
        display: Error of abp - Mismatch
        description: 'Deviation of the vabp diode current under local mismatch. Limits are placeholders.'
        unit: '%'
