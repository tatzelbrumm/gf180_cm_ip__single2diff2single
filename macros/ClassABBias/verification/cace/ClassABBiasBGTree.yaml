#--------------------------------------------------------------
# CACE circuit characterization file (2026-10-09): GF180 bandgap reference ClassABBiasBG.
# Limits are the targets agreed on 2026-10-08 (kickoff_reference_redesign.md section 3): drift +-3 % over
# -40...125 C, line sensitivity <= 1 %/V, start-up from 0 V with 1 us and 1 ms ramps, mismatch sigma <= 2 %
# (checked as +-6 % on the extremes of 100 runs; sigma from the csv). Process spread and leakage: report only.
# Generated by ../../scripts/gen_cace_bg.py; edit this file from now on.
#--------------------------------------------------------------

name:           ClassABBiasBGTree
description:    "CACE fixture: ClassABBiasIn tree fed by the self-contained current-mode bandgap reference of the class-AB driver, 5 uA out of iout, GF180MCU 03v3"
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Christoph Maier
  creation_date:    October 9, 2026
  license:          Apache-2.0

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  vdd:
    description: Analog supply
    type: power
    direction: inout
    Vmin: 3.0
    Vmax: 3.6
  vss:
    description: Analog ground
    type: ground
    direction: inout
  vddo:
    description: Output-stage supply (rail of OP and its replica RP1)
    type: power
    direction: inout
  vsso:
    description: Output-stage ground (rail of ON and its replica RN1)
    type: ground
    direction: inout
  vbp:
    description: bias line vbp of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  vbn:
    description: bias line vbn of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  vbpc:
    description: bias line vbpc of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  vbnc:
    description: bias line vbnc of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  vabp:
    description: bias line vabp of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  vabn:
    description: bias line vabn of the tree (see ClassABBiasIn.yaml)
    type: signal
    direction: output
  en:
    description: Enable, active high (0 / vdd)
    type: digital
    direction: input
  en_b:
    description: Complement of en (from PadEnable/EnableInv)
    type: digital
    direction: input

default_conditions:
  vdd:
    description: Analog supply voltage
    display: VDD
    unit: V
    typical: 3.3
  en:
    description: Enable (1 = enabled, 0 = disabled), as a fraction of vdd
    display: en
    typical: 1
  corner_mos:
    description: Process corner MOSFET (sm141064.ngspice section)
    display: Corner MOSFET
    typical: typical
  corner_res:
    description: Process corner resistors (sm141064.ngspice section)
    display: Corner resistor
    typical: res_typical
  corner_bjt:
    description: Process corner vertical PNPs (sm141064.ngspice section)
    display: Corner PNP
    typical: bjt_typical
  mm:
    description: Local mismatch switch (sw_stat_mismatch; MOS and PNP, the PDK has no resistor mismatch)
    display: Mismatch
    typical: 0
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  t_ramp:
    description: Supply ramp time
    display: Ramp
    unit: s
    typical: 1e-6

parameters:
  tree_params:
    spec:
      e_bp:
        display: Error of bp
        description: 'Deviation of the vbp diode current from 5 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bn:
        display: Error of bn
        description: 'Deviation of the vbn diode current from 5 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bpc:
        display: Error of bpc
        description: 'Deviation of the vbpc diode current from 2 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_bnc:
        display: Error of bnc
        description: 'Deviation of the vbnc diode current from 2 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_abp:
        display: Error of abp
        description: 'Deviation of the vabp diode current from 5 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      e_abn:
        display: Error of abn
        description: 'Deviation of the vabn diode current from 5 uA (tree ClassABBiasIn fed by ClassABBiasBG). Limits are placeholders.'
        unit: '%'
        minimum: {value: -5}
        typical: {value: 0}
        maximum: {value: 5}
      Idd:
        display: Supply current with tree
        description: Current from vdd, reference and tree together (vddo tied to vdd)
        unit: uA
        minimum: {value: any}
        typical: {value: any}
        maximum: {value: any}
    tool:
      ngspice:
        template: ClassABBiasBGTree_tb_dc.sch
        format: ascii
        suffix: .data
        variables: [e_bp, e_bn, e_bpc, e_bnc, e_abp, e_abn, Idd]
    plot:
      e_bn_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: e_bn
        limits: auto
    conditions:
      en:
        typical: 1
      vdd:
        enumerate: [3.0, 3.3, 3.6]
      corner_mos:
        enumerate: [typical, ss, sf, fs, ff]
      corner_res:
        typical: res_typical
      corner_bjt:
        typical: bjt_typical
      temp:
        enumerate: [-40, 27, 125]
